id: 'mobile_tire_v1'
name: 'Mobile Tire Service'
version: '1.0.0'
schema:
  customer:
    attributes:
      - { key: 'vehicle_make', type: 'string', label: 'Vehicle Make', required: true }
      - { key: 'vehicle_model', type: 'string', label: 'Vehicle Model', required: true }
      - { key: 'license_plate', type: 'string', label: 'License Plate' }
  appointment:
    attributes:
      - {
          key: 'service_location',
          type: 'string',
          label: 'Service Address/Location',
          required: true,
        }
      - { key: 'tire_size', type: 'string', label: 'Tire Size (e.g. 225/45R17)' }
      - { key: 'urgent', type: 'boolean', label: 'Emergency/Roadside?' }
  lead:
    attributes:
      - { key: 'location_description', type: 'string', label: 'Where is the vehicle located?' }
      - {
          key: 'issue_type',
          type: 'select',
          label: 'Issue',
          options: ['Flat Tire', 'Seasonal Swap', 'New Tires', 'Rotation'],
        }
ai:
  systemPromptModifier: 'You are a professional mobile tire service coordinator. You help clients book roadside assistance or scheduled tire swaps at their location. Be helpful, efficient, and always confirm the exact service address.'
  tools: ['check_availability', 'book_appointment']
ui:
  theme: 'industrial_blue'
  terminology:
    staff: 'Technician'
    service: 'Service'
    customer: 'Client'
    appointment: 'Service Call'
workflows:
  booking: 'instant'
