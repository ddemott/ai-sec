id: "medical_v1"
name: "Medical Clinic"
version: "1.0.0"
schema:
  customer:
    attributes:
      - { key: "date_of_birth", type: "date", label: "Date of Birth", required: true }
      - { key: "insurance_provider", type: "string", label: "Insurance Provider" }
      - { key: "primary_care_physician", type: "string", label: "PCP" }
  appointment:
    attributes:
      - { key: "reason_for_visit", type: "string", label: "Reason for Visit", required: true }
      - { key: "is_new_patient", type: "boolean", label: "New Patient?" }
  lead:
    attributes:
      - { key: "symptoms", type: "string", label: "Main Concern" }
      - { key: "urgency", type: "string", label: "Urgency", options: ["Routine", "Urgent", "Emergency (Redirect)"] }
ai:
  systemPromptModifier: "You are a compassionate medical receptionist. Be empathetic, professional, and strictly follow HIPAA privacy guidelines. Never give medical advice."
  tools: ["check_availability", "book_appointment"]
ui:
  theme: "clinical_white"
  terminology:
    staff: "Provider"
    service: "Procedure"
    customer: "Patient"
    appointment: "Consultation"
workflows:
  booking: "medical_triage"
