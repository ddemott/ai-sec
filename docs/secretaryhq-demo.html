<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecretaryHQ — Interactive Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── THEME VARIABLES ──────────────────────────────────────────────────── */
:root {
  --font-display: 'Bebas Neue', sans-serif;
  --font-body:    'DM Sans', sans-serif;
}
[data-theme="navy"] {
  --bg-base:#090E1A; --bg-surface:#0D1525; --bg-raised:#111C30; --bg-card:#0F1A2E;
  --accent:#2563EB; --accent-soft:#60A5FA; --accent-muted:rgba(37,99,235,0.12); --accent-glow:rgba(37,99,235,0.25);
  --text-primary:#E8F0FF; --text-secondary:#7A90B8; --text-muted:#3A4E6E;
  --border:rgba(37,99,235,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#34D399; --red:#F87171; --yellow:#FCD34D;
}
[data-theme="rose"] {
  --bg-base:#160F14; --bg-surface:#1E1219; --bg-raised:#271820; --bg-card:#1C1018;
  --accent:#BE185D; --accent-soft:#F9A8D4; --accent-muted:rgba(190,24,93,0.12); --accent-glow:rgba(190,24,93,0.22);
  --text-primary:#FDE8F0; --text-secondary:#B87A96; --text-muted:#6E3A52;
  --border:rgba(190,24,93,0.2); --border-soft:rgba(255,255,255,0.06);
  --green:#34D399; --red:#F87171; --yellow:#FCD34D;
}
[data-theme="forest"] {
  --bg-base:#0A110E; --bg-surface:#0E1812; --bg-raised:#132018; --bg-card:#111C15;
  --accent:#16A34A; --accent-soft:#86EFAC; --accent-muted:rgba(22,163,74,0.12); --accent-glow:rgba(22,163,74,0.22);
  --text-primary:#E8F5EC; --text-secondary:#7AAE8A; --text-muted:#3A6E4A;
  --border:rgba(22,163,74,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#34D399; --red:#F87171; --yellow:#FCD34D;
}

/* ── BASE ──────────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--bg-base);color:var(--text-primary);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background 0.3s,color 0.3s;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px;}
select option{background:#111;}

/* ── LAYOUT ────────────────────────────────────────────────────────────── */
#topbar{background:var(--bg-surface);border-bottom:1px solid var(--border-soft);padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:48px;flex-shrink:0;}
#notice{background:var(--accent-muted);border-bottom:1px solid var(--border);padding:5px 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;font-size:12px;}
#layout{display:grid;grid-template-columns:190px 1fr;flex:1;min-height:0;}
#sidebar{background:var(--bg-surface);border-right:1px solid var(--border-soft);padding-top:8px;display:flex;flex-direction:column;overflow:hidden;}
#content{overflow:auto;background:var(--bg-base);}

/* ── SIDEBAR ───────────────────────────────────────────────────────────── */
.sec-lbl{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);padding:10px 14px 4px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;color:var(--text-secondary);cursor:pointer;border-left:2px solid transparent;transition:all 0.1s;}
.nav-item:hover{color:var(--text-primary);background:rgba(255,255,255,0.02);}
.nav-item.active{color:var(--text-primary);border-left-color:var(--accent);background:var(--accent-muted);}
.nav-item svg{width:14px;height:14px;flex-shrink:0;opacity:0.6;}
.nav-item.active svg{opacity:1;}
#sidebar-bottom{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border-soft);}

/* ── BUTTONS ───────────────────────────────────────────────────────────── */
.btn-primary{background:var(--accent);color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border-soft);padding:7px 14px;border-radius:7px;font-size:13px;cursor:pointer;font-family:var(--font-body);}
.biz-btn{background:transparent;border:1px solid var(--border-soft);color:var(--text-secondary);padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-body);}
.biz-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.theme-btn{background:transparent;border:1px solid var(--border-soft);color:var(--text-secondary);padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;gap:5px;}
.theme-btn.active{background:var(--accent-muted);border-color:var(--border);color:var(--accent-soft);}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-muted);padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);transition:all 0.1s;}
.tab-btn.active{color:var(--accent-soft);border-bottom-color:var(--accent);}

/* ── CARDS ─────────────────────────────────────────────────────────────── */
.card{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:10px;}
.page-wrap{padding:1.25rem;}
.page-title{font-family:var(--font-display);font-size:1.5rem;letter-spacing:0.04em;color:var(--text-primary);margin-bottom:2px;}
.page-sub{font-size:12px;color:var(--text-muted);margin-bottom:1rem;}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex-shrink:0;}

/* ── SCHEDULER ─────────────────────────────────────────────────────────── */
.time-col{width:52px;flex-shrink:0;border-right:1px solid var(--border-soft);}
.time-cell{height:60px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;padding:4px 5px;font-size:10px;color:var(--text-muted);}
.lane{flex:1;min-width:155px;position:relative;border-left:1px solid var(--border-soft);}
.lane-slot{height:60px;border-bottom:1px solid rgba(255,255,255,0.02);cursor:pointer;transition:background 0.1s;}
.lane-slot:hover{background:var(--accent-muted);}
.appt{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;cursor:pointer;overflow:hidden;z-index:2;}
.appt-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appt-svc{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appt-time{font-size:10px;opacity:.5;}

/* ── DETAIL PANEL ──────────────────────────────────────────────────────── */
#detail-panel{position:fixed;bottom:20px;right:20px;background:var(--bg-raised);border:1px solid var(--border);border-radius:12px;padding:1.25rem;width:270px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;}
.detail-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}

/* ── MODAL ─────────────────────────────────────────────────────────────── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;place-items:center;z-index:200;}
#modal-overlay.open{display:grid;}
#modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:1.75rem;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.field-label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;font-weight:500;}
.field-inp{width:100%;background:var(--bg-raised);border:1px solid var(--border-soft);color:var(--text-primary);padding:8px 10px;border-radius:7px;font-size:13px;font-family:var(--font-body);outline:none;margin-bottom:10px;}

/* ── CUSTOMERS ─────────────────────────────────────────────────────────── */
#cust-layout{display:grid;grid-template-columns:255px 1fr;gap:1rem;height:calc(100vh - 200px);}
.cust-item{padding:10px 12px;border-bottom:1px solid var(--border-soft);cursor:pointer;display:flex;align-items:center;gap:10px;border-left:2px solid transparent;}
.cust-item:hover{background:rgba(255,255,255,0.02);}
.cust-item.active{background:var(--accent-muted);border-left-color:var(--accent);}

/* ── COVERAGE ──────────────────────────────────────────────────────────── */
.cov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.cov-bar-wrap{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;margin:5px 0;overflow:hidden;}
.hmap{display:grid;grid-template-columns:20px repeat(8,1fr);gap:2px;margin-top:10px;}
.hcell{height:16px;border-radius:3px;}

/* ── ANALYTICS ─────────────────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1rem;}
.stat-card{padding:1rem 1.25rem;}
.stat-val{font-family:var(--font-display);font-size:1.8rem;color:var(--text-primary);letter-spacing:0.03em;line-height:1;}
.stat-lbl{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;}
.stat-note{font-size:11px;margin-top:4px;}
</style>
</head>

function fmtH(h){const hr=Math.floor(h),min=h%1===.5?'30':'00',ap=hr>=12?'pm':'am';const disp=hr===0?12:hr>12?hr-12:hr;return `${disp}:${min}${ap}`;}

function switchTheme(t){
  document.body.setAttribute('data-theme',t);
}

function switchBiz(k){
  state.biz=k;state.appts=[...BIZ[k].appointments];state.selAppt=null;state.selCust=null;
  state.skillsMode=false;state.staffOrderDirty=false;
  document.getElementById('biz-name-top').textContent=BIZ[k].name;
  updateSidebar();showView(state.view);
}

function updateSidebar(){
  const b=BIZ[state.biz];
  document.getElementById('sb-appt-count').textContent=`${state.appts.length} appointments`;
  document.getElementById('sb-staff-count').textContent=`${b.staff.length} ${b.staffLabel.toLowerCase()}`;
}

function showView(v){
  state.view=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const ni=document.getElementById('nav-'+v);if(ni)ni.classList.add('active');
  closeDetail();
  const c=document.getElementById('content');
  if(v==='schedule')c.innerHTML=renderSchedule();
  else if(v==='customers')c.innerHTML=renderCustomers();
  else if(v==='coverage')c.innerHTML=renderCoverage();
  else if(v==='analytics')c.innerHTML=renderAnalytics();
  if(v==='schedule')bindScheduleEvents();
  if(v==='customers')bindCustomerEvents();
  if(v==='coverage')bindCoverageEvents();
}

// ── SCHEDULE ───────────────────────────────────────────────────────────────
function getStaffOrder(biz){
  return state.staffOrder[biz] || BIZ[biz].staff.map(s=>s.id);
}

function getOrderedStaff(biz){
  const order=getStaffOrder(biz);
  return order.map(id=>BIZ[biz].staff.find(s=>s.id===id)).filter(Boolean);
}

function buildSkillColorMap(biz){
  const allSkills=[...new Set(BIZ[biz].staff.flatMap(s=>s.skills||[]))];
  const map={};
  allSkills.forEach((sk,i)=>{map[sk]=SKILL_COLORS[i%SKILL_COLORS.length];});
  return map;
}

        const col=skillColorMap[sk]||'#2563EB';
        const left=b.openHour*COL_W+2;
        const width=(b.closeHour-b.openHour)*COL_W-4;
        const top=8+si*22;
        html+=`<div style="position:absolute;left:${left}px;top:${top}px;height:18px;width:${width}px;background:${col};opacity:0.7;border-radius:4px;display:flex;align-items:center;padding:0 8px;z-index:2;pointer-events:none;">
          <span style="font-size:10px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${sk}</span>
        </div>`;
      });
    } else {
      // HOURS MODE — appointment blocks
      sAppts.forEach(a=>{
        const sc=a.status==='confirmed'?{bg:'rgba(37,99,235,0.28)',bd:'rgba(37,99,235,0.55)',tx:'#BAD4FF'}:a.status==='pending'?{bg:'rgba(252,211,77,0.18)',bd:'rgba(252,211,77,0.45)',tx:'#FDE68A'}:{bg:'rgba(52,211,153,0.15)',bd:'rgba(52,211,153,0.35)',tx:'#6EF0C4'};
        const left=a.startHour*COL_W+2,width=a.duration*COL_W-4;
        html+=`<div class="appt" data-id="${a.id}" style="position:absolute;left:${left}px;top:5px;bottom:5px;width:${width}px;background:${sc.bg};border:1px solid ${sc.bd};border-radius:6px;padding:4px 8px;cursor:pointer;overflow:hidden;z-index:2;">
          <div style="font-size:11px;font-weight:600;color:${sc.tx};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.customer}</div>
          <div style="font-size:10px;color:${sc.tx};opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.service}</div>
          ${a.duration>=.75?`<div style="font-size:10px;color:${sc.tx};opacity:.5;">${fmtH(a.startHour)}-${fmtH(a.startHour+a.duration)}</div>`:''}
        </div>`;
      });
    }

    html+=`</div>`;
  });

  html+=`</div></div></div></div>`;

  // Legend
  if(state.skillsMode){
    const skillColorMap2=buildSkillColorMap(state.biz);
    const allSkills=[...new Set(BIZ[state.biz].staff.flatMap(s=>s.skills||[]))];
    html+=`<div style="display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap;">
      <span style="font-size:11px;color:var(--text-muted);font-weight:600;">SKILLS:</span>`;
    allSkills.forEach(sk=>{
      html+=`<div style="display:flex;align-items:center;gap:4px;">
        <div style="width:10px;height:10px;border-radius:2px;background:${skillColorMap2[sk]};opacity:0.7;"></div>
        <span style="font-size:11px;color:var(--text-muted);">${sk}</span>
      </div>`;
    });
    html+=`<span style="font-size:11px;color:var(--text-muted);margin-left:auto;">Bars show skill coverage during business hours</span></div>`;
  } else {
    html+=`<div style="display:flex;gap:14px;align-items:center;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(37,99,235,0.28);border:1px solid rgba(37,99,235,0.55);"></div><span style="font-size:11px;color:var(--text-muted);">Confirmed</span></div>
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(252,211,77,0.18);border:1px solid rgba(252,211,77,0.45);"></div><span style="font-size:11px;color:var(--text-muted);">Pending</span></div>
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.35);"></div><span style="font-size:11px;color:var(--text-muted);">Completed</span></div>
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(0,0,0,0.2);border:1px solid var(--border-soft);"></div><span style="font-size:11px;color:var(--text-muted);">Outside hours</span></div>
      <span style="font-size:11px;color:var(--text-muted);margin-left:auto;">Drag ⠿ to reorder &middot; Click slot to book &middot; Click appointment for details</span>
    </div>`;
  }

  html+=`</div>`;
  return html;
}



function bindScheduleEvents(){
  document.querySelectorAll('.lane-slot').forEach(el=>{
    el.addEventListener('click',()=>openModal(el.dataset.staff,parseFloat(el.dataset.hour)));
  });
  document.querySelectorAll('.appt').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();showDetail(el.dataset.id);});
  });
  const body=document.getElementById('sched-body');
  const header=document.getElementById('sched-header');
  const staffCol=document.getElementById('staff-col');
  const earliest=state.appts.length?Math.min(...state.appts.map(a=>a.startHour)):7;
  const scrollX=Math.max(0,earliest-1)*state.zoom;
  if(body){body.scrollLeft=scrollX;}
  if(header){header.scrollLeft=scrollX;}
  if(body&&header){
    body.addEventListener('scroll',()=>{
      header.scrollLeft=body.scrollLeft;
      if(staffCol) staffCol.scrollTop=body.scrollTop;
    },{passive:true});
  }
  // Sync staff-col vertical scroll with sched-body
  if(staffCol&&body){
    body.addEventListener('scroll',()=>{staffCol.scrollTop=body.scrollTop;},{passive:true});
  }
}

function showDetail(id){

  document.getElementById('dp-name').textContent=a.customer;

  document.getElementById('dp-rows').innerHTML=rows.map(([l,v])=>`<div class="detail-row"><span style="color:var(--text-muted);">${l}</span><span style="color:${l==='Status'?(a.status==='confirmed'?'var(--accent-soft)':a.status==='completed'?'var(--green)':'var(--yellow)'):'var(--text-primary)'};font-weight:${l==='Status'?600:400};text-transform:${l==='Status'?'capitalize':'none'};">${v}</span></div>`).join('')+(a.notes?`<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;font-style:italic;">${a.notes}</div>`:'');

  });
  html+=`</div>
      <div style="display:flex;gap:12px;margin-top:10px;">
        <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:2px;background:var(--accent);opacity:0.5;"></div><span style="font-size:11px;color:var(--text-muted);">Calls in</span></div>
        <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:2px;background:var(--accent);"></div><span style="font-size:11px;color:var(--text-muted);">Converted</span></div>
      </div>
    </div>

    <!-- BUSIEST HOURS -->
    <div class="card" style="padding:1.25rem;">
      <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;">Busiest Hours</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:1rem;">When is your phone ringing? When are bookings actually made?</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:100px;">`;
  hours.forEach((h,i)=>{
    const callH=Math.round((hourCalls[i]/maxHour)*90);
    const bookH=Math.round((hourBooks[i]/maxHour)*90);
    html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div style="width:100%;display:flex;gap:1px;align-items:flex-end;height:90px;">
        <div style="flex:1;background:var(--accent);opacity:0.5;border-radius:2px 2px 0 0;height:${callH}px;"></div>
        <div style="flex:1;background:var(--accent);border-radius:2px 2px 0 0;height:${bookH}px;"></div>
      </div>
      <div style="font-size:9px;color:var(--text-muted);">${h}</div>
    </div>`;
  });
  html+=`</div>
      <div style="display:flex;gap:12px;margin-top:10px;">
        <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:2px;background:var(--accent);opacity:0.5;"></div><span style="font-size:11px;color:var(--text-muted);">Calls in</span></div>
        <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:2px;background:var(--accent);"></div><span style="font-size:11px;color:var(--text-muted);">Booked</span></div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">

    <!-- CALLER ABANDONMENT -->
    <div class="card" style="padding:1.25rem;">
      <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;">Where Callers Drop Off</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:1rem;">At what point in the call are people hanging up?</div>`;
  const maxAband=Math.max(...abandonment.map(a=>a.pct));
  abandonment.forEach(a=>{
    const isHigh=a.pct>=25;
    html+=`<div style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
        <span style="font-size:12px;color:var(--text-primary);">${a.point}</span>
        <span style="font-size:12px;color:${isHigh?'var(--yellow)':'var(--text-muted)'};font-weight:${isHigh?600:400};">${a.pct}%</span>
      </div>
      <div style="height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${(a.pct/maxAband)*100}%;background:${isHigh?'var(--yellow)':'var(--accent)'};opacity:${isHigh?1:0.5};border-radius:3px;"></div>
      </div>
    </div>`;
  });
  html+=`<div style="margin-top:10px;font-size:11px;color:var(--text-muted);font-style:italic;">Highlighted bars show where most callers are leaving — worth investigating why.</div>
    </div>

    <!-- RETURN RATE BY FIRST SERVICE -->
    <div class="card" style="padding:1.25rem;">
      <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;">Return Rate by First Service</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:1rem;">Of customers whose first booking was this service, how many came back?</div>`;
  returnData.forEach(r=>{
    html+=`<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
        <span style="font-size:12px;color:var(--text-primary);">${r.svc}</span>
        <span style="font-size:12px;color:var(--text-secondary);">${r.return}% returned</span>
      </div>
      <div style="height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${r.return}%;background:${r.color};border-radius:3px;opacity:0.7;"></div>
      </div>
    </div>`;
  });
  html+=`<div style="margin-top:10px;font-size:11px;color:var(--text-muted);font-style:italic;">Low return rates on a high-volume service is worth a closer look.</div>
    </div>

  </div>

  <!-- NO SHOW HEATMAP -->
  <div class="card" style="padding:1.25rem;margin-bottom:1rem;">
    <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;">No-Show Pattern</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:1rem;">Which days have the most no-shows? Patterns here often mean something.</div>
    <div style="display:flex;gap:8px;align-items:flex-end;">`;
  weekDays.forEach((d,i)=>{
    const pct=Math.round((noShows[i]/Math.max(...noShows))*100);
    const col=noShows[i]>=3?'var(--red)':noShows[i]>=2?'var(--yellow)':'var(--green)';
    html+=`<div style="flex:1;text-align:center;">
      <div style="font-size:13px;font-weight:600;color:${col};margin-bottom:4px;">${noShows[i]}</div>
      <div style="height:40px;background:rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;display:flex;align-items:flex-end;">
        <div style="width:100%;background:${col};opacity:0.6;border-radius:4px;height:${pct}%;"></div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${d}</div>
    </div>`;
  });
  html+=`</div>
  </div>

</div>`;
  return html;
}


// ── MODAL ──────────────────────────────────────────────────────────────────
function openModal(staffId,startHour){
  const b=BIZ[state.biz];
  document.getElementById('m-staff-lbl').textContent=b.staffLabel.slice(0,-1);
  const ms=document.getElementById('m-staff');
  ms.innerHTML=b.staff.map(s=>`<option value="${s.id}">${s.name} — ${s.role}</option>`).join('');
  if(staffId)ms.value=staffId;
  document.getElementById('m-svc').innerHTML=b.services.map(s=>`<option value="${s.id}">${s.name} — ${s.duration}hr · $${s.price}</option>`).join('');
  const mh=document.getElementById('m-hour');
  mh.innerHTML=Array.from({length:18},(_,i)=>8+i*.5).map(h=>`<option value="${h}">${fmtH(h)}</option>`).join('');
  if(startHour)mh.value=startHour;
  document.getElementById('m-name').value='';
  document.getElementById('m-phone').value='';
  document.getElementById('m-notes').value='';
  document.getElementById('m-preview').style.display='none';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

function updatePreview(){
  const name=document.getElementById('m-name').value.trim();
  if(!name){document.getElementById('m-preview').style.display='none';return;}
  const b=BIZ[state.biz];
  const staff=b.staff.find(s=>s.id===document.getElementById('m-staff').value);
  const svc=b.services.find(s=>s.id===document.getElementById('m-svc').value);
  const h=parseFloat(document.getElementById('m-hour').value);
  const p=document.getElementById('m-preview');
  p.style.display='block';
  p.innerHTML=`Booking <b>${name}</b> with <b>${staff.name}</b> for <b>${svc.name}</b> at <b>${fmtH(h)}</b> — ends ${fmtH(h+svc.duration)} · $${svc.price}`;
}

function confirmBooking(){
  const name=document.getElementById('m-name').value.trim();if(!name)return;
  const b=BIZ[state.biz];
  const svc=b.services.find(s=>s.id===document.getElementById('m-svc').value);
  state.appts.push({id:'new-'+Date.now(),staffId:document.getElementById('m-staff').value,customer:name,service:svc.name,startHour:parseFloat(document.getElementById('m-hour').value),duration:svc.duration,status:'confirmed',phone:document.getElementById('m-phone').value||'Not provided',notes:document.getElementById('m-notes').value});
  updateSidebar();closeModal();showView('schedule');
}

// ── SKILLS TOGGLE ────────────────────────────────────────────────────────
function setSkillsMode(on){
  state.skillsMode=on;
  showView('schedule');
}

// ── DRAG TO REORDER ──────────────────────────────────────────────────────
function onDragStart(e, staffId){
  state.dragSrc=staffId;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',staffId);
  // dim the dragged row
  setTimeout(()=>{
    const el=document.getElementById('namerow-'+staffId);
    if(el) el.style.opacity='0.4';
    const ar=document.getElementById('apptrow-'+staffId);
    if(ar) ar.style.opacity='0.4';
  },0);
}

function onDragOver(e, staffId){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  if(staffId===state.dragSrc) return;
  // highlight drop target
  const el=document.getElementById('namerow-'+staffId);
  if(el) el.style.borderTop='2px solid var(--accent)';
  const ar=document.getElementById('apptrow-'+staffId);
  if(ar) ar.style.borderTop='2px solid var(--accent)';
}

function onDragLeave(e){
  // remove highlights
  document.querySelectorAll('[id^="namerow-"],[id^="apptrow-"]').forEach(el=>{
    el.style.borderTop='';
  });
}

function onDrop(e, targetId){
  e.preventDefault();
  onDragLeave(e);
  const srcId=state.dragSrc;
  if(!srcId||srcId===targetId) return;
  // Restore opacity
  const srcEl=document.getElementById('namerow-'+srcId);
  if(srcEl) srcEl.style.opacity='';
  const srcAr=document.getElementById('apptrow-'+srcId);
  if(srcAr) srcAr.style.opacity='';

  const order=[...getStaffOrder(state.biz)];
  const fromIdx=order.indexOf(srcId);
  const toIdx=order.indexOf(targetId);
  if(fromIdx===-1||toIdx===-1) return;
  order.splice(fromIdx,1);
  order.splice(toIdx,0,srcId);
  state.staffOrder[state.biz]=order;
  state.staffOrderDirty=true;
  state.dragSrc=null;
  showView('schedule');
}

function saveStaffOrder(){
  state.savedStaffOrder[state.biz]=[...getStaffOrder(state.biz)];
  state.staffOrderDirty=false;
  showView('schedule');
  // In real app: POST /tenants/:id/staff-order
}

function discardStaffOrder(){
  state.staffOrder[state.biz]=state.savedStaffOrder[state.biz]
    ? [...state.savedStaffOrder[state.biz]]
    : null;
  state.staffOrderDirty=false;
  showView('schedule');
}

// ── ZOOM ──────────────────────────────────────────────────────────────────
function setZoom(delta){
  state.zoom=Math.min(140,Math.max(36,state.zoom+delta));
  showView('schedule');
}

// ── STAFF CARD ────────────────────────────────────────────────────────────
function showStaffCard(staffId, e){
  e.stopPropagation();
  const b=BIZ[state.biz];
  const s=b.staff.find(x=>x.id===staffId);
  if(!s)return;
  const todayAppts=state.appts.filter(a=>a.staffId===s.id);
  const todayHrs=todayAppts.reduce((sum,a)=>sum+a.duration,0);
  document.getElementById('sc-avatar').style.background=s.color;
  document.getElementById('sc-avatar').textContent=s.initials;
  document.getElementById('sc-name').textContent=s.name;
  document.getElementById('sc-role').textContent=s.role;
  document.getElementById('sc-today').textContent=`${todayAppts.length} appts · ${todayHrs}hrs`;
  document.getElementById('sc-shift').textContent=s.shift||'Not set';
  document.getElementById('sc-skills').innerHTML=(s.skills||[]).map(sk=>`<div style="font-size:12px;color:var(--text-secondary);padding:2px 0 2px 12px;">${sk}</div>`).join('');
  const card=document.getElementById('staff-card');
  card.style.display='block';
  // Position near the click
  const rect=e.currentTarget.getBoundingClientRect();
  let top=rect.bottom+4;
  let left=rect.left;
  // Keep on screen
  if(left+220>window.innerWidth) left=window.innerWidth-228;
  if(top+280>window.innerHeight) top=rect.top-284;
  card.style.top=top+'px';
  card.style.left=left+'px';
}

function closeStaffCard(){
  document.getElementById('staff-card').style.display='none';
}

// ── INIT ───────────────────────────────────────────────────────────────────
document.getElementById('biz-name-top').textContent=BIZ.tire.name;
document.addEventListener('click',()=>closeStaffCard());
updateSidebar();
showView('schedule');
</script>
