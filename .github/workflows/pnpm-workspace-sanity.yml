name: PNPM workspace sanity

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch: {}

jobs:
  pnpm-workspace-sanity:
    name: PNPM workspace sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Quick repo sanity (fail-fast)
        run: |
          echo "Repository root files:"
          ls -la
          echo "--- pnpm-workspace.yaml exists? ---"
          if [ ! -f pnpm-workspace.yaml ]; then
            echo "ERROR: pnpm-workspace.yaml not found in repo root" >&2
            exit 1
          fi
          echo "pnpm-workspace.yaml (head):" && sed -n '1,200p' pnpm-workspace.yaml || true

      - name: PNPM workspace install (verify)
        run: |
          pnpm -v
          pnpm -w install --frozen-lockfile --ignore-scripts --reporter=append-only
        timeout-minutes: 6

      - name: Verify workspace packages discovered
        run: |
          echo "Top-level workspace packages:" > workspace-packages.txt
          pnpm -w -s -r --reporter=append-only --depth 0 list >> workspace-packages.txt || true
          sed -n '1,120p' workspace-packages.txt

      - name: Upload pnpm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-workspace-diagnostics
          path: |
            pnpm-workspace.yaml
            pnpm-lock.yaml
            workspace-packages.txt
            ./**/package.json

      - name: Success marker
        if: success()
        run: |
          echo "pnpm workspace sanity: OK"
