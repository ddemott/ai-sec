name: Zero-vendor SMS alerts

# ALERTS.md §3.9 without a metrics vendor. Curls prod /metrics every 30
# minutes, evaluates the boot-lifetime SMS failure ratio and the opt-out
# confirmation counter, opens one GitHub issue on breach.
#
# METRICS_TOKEN must be a repo secret matching Railway's METRICS_TOKEN.
# Unset → the job exits 0 and pages nobody (same as the script's SKIP).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Evaluate §3.9
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Scrape and evaluate
        id: eval
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set +e
          OUTPUT=$(npx tsx scripts/zeroVendorAlerts.ts \
            "https://secretary-hq-production.up.railway.app/metrics" 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          echo "$OUTPUT" > "$GITHUB_WORKSPACE/zero-vendor.txt"
          if [ "$CODE" -eq 0 ]; then
            exit 0
          fi
          if [ "$CODE" -eq 10 ]; then
            echo "breached=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$CODE"

      - name: Open or reuse an issue
        if: steps.eval.outputs.breached == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search "in:title [zero-vendor]" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$GITHUB_WORKSPACE/zero-vendor.txt"
            echo "commented on #$EXISTING"
            exit 0
          fi
          gh issue create \
            --title "[zero-vendor] SMS send failure (ALERTS.md §3.9)" \
            --body-file "$GITHUB_WORKSPACE/zero-vendor.txt"
