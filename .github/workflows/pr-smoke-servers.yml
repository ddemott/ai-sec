name: "PR — smoke (servers + smoke tests)"
on:
  pull_request:
    types: [opened, synchronize, reopened]
    # run for docs/dev branches and code changes that affect runtime
    paths:
      - 'src/**'
      - 'package.json'
      - 'migrations/**'
      - 'seed-demo.sh'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'DEVELOPER.md'

jobs:
  smoke-servers:
    name: Start DB & app, run smoke API checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_secretary
          POSTGRES_PASSWORD: ai_secretary
          POSTGRES_DB: ai_secretary
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ai_secretary" 
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U ai_secretary >/dev/null 2>&1; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready" && exit 1
        env:
          PGPASSWORD: ai_secretary

      - name: Run migrations
        env:
          DATABASE_URL: postgres://ai_secretary:ai_secretary@localhost:5432/ai_secretary
          DB_TYPE: postgresql
        run: |
          node scripts/run-migrations.js || node scripts/run-migrations.cjs

      - name: Seed demo data
        env:
          DATABASE_URL: postgres://ai_secretary:ai_secretary@localhost:5432/ai_secretary
          DB_TYPE: postgresql
        run: |
          chmod +x ./seed-demo.sh || true
          ./seed-demo.sh

      - name: Start app (development)
        env:
          DATABASE_URL: postgres://ai_secretary:ai_secretary@localhost:5432/ai_secretary
          DB_TYPE: postgresql
          NODE_ENV: development
          PORT: 3000
        run: |
          pnpm start >server.log 2>&1 & echo $! > server.pid
          echo "waiting for http://127.0.0.1:3000/health..."
          n=0
          until curl -sS --fail http://127.0.0.1:3000/health || [ $n -ge 60 ]; do
            sleep 1; n=$((n+1))
            tail -n +1 server.log | sed -n '1,120p' || true
          done
          if [ $n -ge 60 ]; then
            echo "server did not respond in time"; tail -n 200 server.log; exit 1; fi

      - name: Smoke API checks
        env:
          API_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          echo "health ->" $(curl -sS ${API_URL}/health)

          # login (demo creds)
          LOGIN=$(curl -sS -X POST ${API_URL}/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@test.com","password":"password"}')
          echo "login: " $(echo "$LOGIN" | jq -r '.ok,.user.email' )
          TOKEN=$(echo "$LOGIN" | jq -r '.token // empty')
          test -n "$TOKEN"

          # assume tenant and call tenant-scoped endpoint
          ASSUME=$(curl -sS -X POST ${API_URL}/auth/assume-tenant -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"tenantId":1}')
          echo "$ASSUME" | jq -r '.ok'
          ASSUMED_TOKEN=$(echo "$ASSUME" | jq -r '.token // empty')
          test -n "$ASSUMED_TOKEN"

          # call a tenant-protected endpoint
          curl -sS -H "Authorization: Bearer $ASSUMED_TOKEN" ${API_URL}/customers | jq -e '.'

      - name: Upload server log
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

      - name: Success marker
        run: echo "smoke checks passed"
