name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + tests + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Provision Postgres so DB-level integration tests run for real
      # instead of silently skipping. Without this service, ~80 tests
      # under src/*.test.ts that gate on `dbAvailable` from getRootClient()
      # would always pass with zero assertions executed.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: bash scripts/setup-db.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/test_db

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm test

  dashboard:
    name: Dashboard (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run dashboard tests
        run: npm test
