name: "CI - Smoke: assume-tenant + calendar"

on:
  pull_request:
    paths:
      - 'src/**'
      - 'migrations/**'
      - '__tests__/auth.assume-tenant.test.ts'
      - '__tests__/calendar.test.ts'
  workflow_dispatch: {}

jobs:
  smoke-assume-tenant:
    name: Smoke - assume-tenant + calendar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ai_secretary
          POSTGRES_PASSWORD: ai_secretary
          POSTGRES_DB: ai_secretary
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U ai_secretary -d ai_secretary -h localhost -p 5432"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm i -g pnpm@8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5438 -U ai_secretary && break || sleep 1
          done

      - name: Run migrations (fast)
        env:
          DATABASE_URL: postgres://ai_secretary:ai_secretary@localhost:5438/ai_secretary
        run: node scripts/run-migrations.cjs --quiet

      - name: Run targeted smoke tests
        env:
          DATABASE_URL: postgres://ai_secretary:ai_secretary@localhost:5438/ai_secretary
          CI: true
        run: pnpm -s vitest --run __tests__/auth.assume-tenant.test.ts __tests__/calendar.test.ts --reporter dot

      - name: Upload vitest results (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs-smoke
          path: |
            vitest.log
            test-results.xml
