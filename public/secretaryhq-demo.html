<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecretaryHQ — Interactive Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── THEME VARIABLES ──────────────────────────────────────────────────── */
:root {
  --font-display: 'Bebas Neue', sans-serif;
  --font-body:    'DM Sans', sans-serif;
}
[data-theme="navy"] {
  --bg-base:#090E1A; --bg-surface:#0D1525; --bg-raised:#111C30; --bg-card:#0F1A2E;
  --accent:#2563EB; --accent-soft:#60A5FA; --accent-muted:rgba(37,99,235,0.12); --accent-glow:rgba(37,99,235,0.25);
  --text-primary:#E8F0FF; --text-secondary:#7A90B8; --text-muted:#6B7F9E;
  --border:rgba(37,99,235,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#34D399; --red:#F87171; --yellow:#FCD34D;
}
[data-theme="rose"] {
  --bg-base:#160F14; --bg-surface:#1E1219; --bg-raised:#271820; --bg-card:#1C1018;
  --accent:#BE185D; --accent-soft:#F9A8D4; --accent-muted:rgba(190,24,93,0.12); --accent-glow:rgba(190,24,93,0.22);
  --text-primary:#FDE8F0; --text-secondary:#B87A96; --text-muted:#9E6F84;
  --border:rgba(190,24,93,0.2); --border-soft:rgba(255,255,255,0.06);
  --green:#34D399; --red:#F87171; --yellow:#FCD34D;
}
[data-theme="forest"] {
  --bg-base:#0A110E; --bg-surface:#0E1812; --bg-raised:#132018; --bg-card:#111C15;
  --accent:#16A34A; --accent-soft:#86EFAC; --accent-muted:rgba(22,163,74,0.12); --accent-glow:rgba(22,163,74,0.22);
  --text-primary:#E8F5EC; --text-secondary:#7AAE8A; --text-muted:#6E9F7F;
  --border:rgba(22,163,74,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#34D399; --red:#F87171; --yellow:#FCD34D;
}
[data-theme="midnight"] {
  --bg-base:#0B0E14; --bg-surface:#13171F; --bg-raised:#1A1F2B; --bg-card:#161C28;
  --accent:#5865F2; --accent-soft:#A5AEFF; --accent-muted:rgba(88,101,242,0.12); --accent-glow:rgba(88,101,242,0.22);
  --text-primary:#E1E4EA; --text-secondary:#8B92A5; --text-muted:#7B8398;
  --border:rgba(88,101,242,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#23A55A; --red:#F23F43; --yellow:#F0B232;
}
[data-theme="nord"] {
  --bg-base:#2E3440; --bg-surface:#3B4252; --bg-raised:#434C5E; --bg-card:#3E4758;
  --accent:#88C0D0; --accent-soft:#B8DEE8; --accent-muted:rgba(136,192,208,0.12); --accent-glow:rgba(136,192,208,0.22);
  --text-primary:#ECEFF4; --text-secondary:#D8DEE9; --text-muted:#7B849A;
  --border:rgba(136,192,208,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#A3BE8C; --red:#BF616A; --yellow:#EBCB8B;
}
[data-theme="sunset"] {
  --bg-base:#1A1412; --bg-surface:#231C18; --bg-raised:#2E2420; --bg-card:#281E1A;
  --accent:#E8914F; --accent-soft:#F0BA8A; --accent-muted:rgba(232,145,79,0.12); --accent-glow:rgba(232,145,79,0.22);
  --text-primary:#F0E6DC; --text-secondary:#A89585; --text-muted:#6B584A;
  --border:rgba(232,145,79,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#6ABF69; --red:#E05252; --yellow:#E8C44F;
}
[data-theme="high-contrast"] {
  --bg-base:#000000; --bg-surface:#0A0A0A; --bg-raised:#1A1A1A; --bg-card:#121212;
  --accent:#FFD60A; --accent-soft:#FFE34D; --accent-muted:rgba(255,214,10,0.12); --accent-glow:rgba(255,214,10,0.22);
  --text-primary:#FFFFFF; --text-secondary:#CCCCCC; --text-muted:#888888;
  --border:rgba(255,214,10,0.18); --border-soft:rgba(255,255,255,0.1);
  --green:#00E676; --red:#FF1744; --yellow:#FFD60A;
}
[data-theme="solarized"] {
  --bg-base:#002B36; --bg-surface:#073642; --bg-raised:#0A4050; --bg-card:#084050;
  --accent:#268BD2; --accent-soft:#6CB4E0; --accent-muted:rgba(38,139,210,0.12); --accent-glow:rgba(38,139,210,0.22);
  --text-primary:#EEE8D5; --text-secondary:#93A1A1; --text-muted:#586E75;
  --border:rgba(38,139,210,0.18); --border-soft:rgba(255,255,255,0.06);
  --green:#859900; --red:#DC322F; --yellow:#B58900;
}

/* ── BASE ──────────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--bg-base);color:var(--text-primary);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background 0.3s,color 0.3s;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px;}
select option{background:#111;}

/* ── LAYOUT ────────────────────────────────────────────────────────────── */
#topbar{background:var(--bg-surface);border-bottom:1px solid var(--border-soft);padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between;height:48px;flex-shrink:0;}
#notice{background:var(--accent-muted);border-bottom:1px solid var(--border);padding:5px 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;font-size:12px;}
#layout{flex:1;min-height:0;overflow:hidden;}
#content{overflow:auto;background:var(--bg-base);height:100%;}

/* ── TOP FOLDER-TAB NAV (matches dashboard FolderTabs.tsx 'lg') ─────────── */
#tabnav{background:var(--bg-surface);border-bottom:1px solid var(--border-soft);flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:8px 16px 0;gap:8px;}
#tabnav-tabs{display:flex;align-items:flex-end;gap:0;}
.nav-item{display:flex;align-items:center;gap:6px;padding:8px 22px 10px;font-size:0.875rem;font-weight:700;color:var(--text-muted);background:var(--bg-base);cursor:pointer;border-radius:6px 6px 0 0;border-top:1px solid var(--border-soft);border-left:1px solid var(--border-soft);border-right:1px solid var(--border-soft);margin-right:-1px;box-shadow:inset 0 -1px 3px rgba(0,0,0,0.3);transition:color 0.1s;position:relative;z-index:1;white-space:nowrap;}
.nav-item:hover{color:var(--text-secondary);}
.nav-item.active{color:var(--accent-soft);background:var(--bg-raised);padding:10px 24px 12px;border-top:2px solid var(--accent);box-shadow:0 -3px 10px rgba(0,0,0,0.35),-3px 0 8px rgba(0,0,0,0.2),3px 0 8px rgba(0,0,0,0.2);z-index:2;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.5;}
.nav-item.active svg{opacity:1;}
.nav-gap{width:24px;flex-shrink:0;}
#tabnav-right{display:flex;align-items:center;gap:8px;padding-bottom:6px;}
.nav-setup-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--accent-soft);background:var(--accent-muted);border:1px solid var(--border);border-radius:20px;padding:5px 12px;white-space:nowrap;}
.nav-profile{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text-secondary);border:1px solid var(--border-soft);background:var(--bg-raised);cursor:pointer;}

/* ── BUTTONS ───────────────────────────────────────────────────────────── */
.btn-primary{background:var(--accent);color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border-soft);padding:7px 14px;border-radius:7px;font-size:13px;cursor:pointer;font-family:var(--font-body);}
.biz-btn{background:transparent;border:1px solid var(--border-soft);color:var(--text-secondary);padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-body);}
.biz-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-muted);padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-body);transition:all 0.1s;}
.tab-btn.active{color:var(--accent-soft);border-bottom-color:var(--accent);}

/* ── CARDS ─────────────────────────────────────────────────────────────── */
.card{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:10px;}
.page-wrap{padding:1.25rem;}
.page-title{font-family:var(--font-display);font-size:1.5rem;letter-spacing:0.04em;color:var(--text-primary);margin-bottom:2px;}
.page-sub{font-size:12px;color:var(--text-muted);margin-bottom:1rem;}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex-shrink:0;}

/* ── SCHEDULER ─────────────────────────────────────────────────────────── */
.time-col{width:52px;flex-shrink:0;border-right:1px solid var(--border-soft);}
.time-cell{height:60px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;padding:4px 5px;font-size:11px;color:var(--text-muted);}
.lane{flex:1;min-width:155px;position:relative;border-left:1px solid var(--border-soft);}
.lane-slot{height:60px;border-bottom:1px solid rgba(255,255,255,0.02);cursor:pointer;transition:background 0.1s;}
.lane-slot:hover{background:var(--accent-muted);}
.appt{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;cursor:pointer;overflow:hidden;z-index:2;}
.appt-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appt-svc{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appt-time{font-size:11px;opacity:.5;}

/* ── DETAIL PANEL ──────────────────────────────────────────────────────── */
#detail-panel{position:fixed;bottom:20px;right:20px;background:var(--bg-raised);border:1px solid var(--border);border-radius:12px;padding:1.25rem;width:270px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;}
.detail-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}

/* ── MODAL ─────────────────────────────────────────────────────────────── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;place-items:center;z-index:200;}
#modal-overlay.open{display:grid;}
#modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:1.75rem;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.field-label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;font-weight:500;}
.field-inp{width:100%;background:var(--bg-raised);border:1px solid var(--border-soft);color:var(--text-primary);padding:8px 10px;border-radius:7px;font-size:13px;font-family:var(--font-body);outline:none;margin-bottom:10px;}

/* ── CUSTOMERS ─────────────────────────────────────────────────────────── */
#cust-layout{display:grid;grid-template-columns:255px 1fr;gap:1rem;height:calc(100vh - 200px);}
.cust-item{padding:10px 12px;border-bottom:1px solid var(--border-soft);cursor:pointer;display:flex;align-items:center;gap:10px;border-left:2px solid transparent;}
.cust-item:hover{background:rgba(255,255,255,0.02);}
.cust-item.active{background:var(--accent-muted);border-left-color:var(--accent);}

/* ── ANALYTICS ─────────────────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1rem;}
.stat-card{padding:1rem 1.25rem;}
.stat-val{font-family:var(--font-display);font-size:1.8rem;color:var(--text-primary);letter-spacing:0.03em;line-height:1;}
.stat-lbl{font-size:11px;color:var(--text-muted);font-weight:500;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;}
.stat-note{font-size:11px;margin-top:4px;}
</style>
</head>
<body data-theme="navy">

function fmtH(h){const hr=Math.floor(h),min=h%1===.5?'30':'00',ap=hr>=12?'pm':'am';const disp=hr===0?12:hr>12?hr-12:hr;return `${disp}:${min}${ap}`;}

function switchTheme(t){document.body.setAttribute('data-theme',t);}

function switchBiz(k){
  state.biz=k;state.appts=[...BIZ[k].appointments];state.selAppt=null;state.selCust=null;state.selCall=null;
  state.skillsMode=false;state.staffOrderDirty=false;
  document.getElementById('biz-name-top').textContent=BIZ[k].name;
  updateSidebar();showView(state.view);
}

function updateSidebar(){
  // Sidebar removed in favor of top tab nav; counts now live in-view.
  // Kept as a no-op guard so existing callers (switchBiz, delete) stay valid.
  const apptEl=document.getElementById('sb-appt-count');
  const staffEl=document.getElementById('sb-staff-count');
  if(!apptEl&&!staffEl)return;
  const b=BIZ[state.biz];
  if(apptEl)apptEl.textContent=`${state.appts.length} appointments`;
  if(staffEl)staffEl.textContent=`${b.staff.length} ${b.staffLabel.toLowerCase()}`;
}

function showView(v){
  state.view=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const ni=document.getElementById('nav-'+v);if(ni)ni.classList.add('active');
  closeDetail();
  const c=document.getElementById('content');
  if(v==='home')c.innerHTML=renderHome();
  else if(v==='schedule')c.innerHTML=renderSchedule();
  else if(v==='customers')c.innerHTML=renderCustomers();
  else if(v==='calls')c.innerHTML=renderCalls();
  else if(v==='services')c.innerHTML=renderServices();
  else if(v==='team')c.innerHTML=renderTeam();
  else if(v==='ai')c.innerHTML=renderAI();
  if(v==='schedule')bindScheduleEvents();
  if(v==='customers')bindCustomerEvents();
  if(v==='calls')bindCallEvents();
}

        <span style="font-size:11px;color:var(--accent-soft);display:inline-flex;align-items:center;gap:3px;">Full schedule <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </div>`;
  todayAppts.forEach(a=>{
    const staff=b.staff.find(s=>s.id===a.staffId);
    const sc=a.status==='confirmed'?{bg:'var(--accent-muted)',col:'var(--accent-soft)'}:a.status==='completed'?{bg:'rgba(52,211,153,0.1)',col:'var(--green)'}:{bg:'rgba(252,211,77,0.1)',col:'var(--yellow)'};
    html+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);">
      <div style="font-size:12px;color:var(--text-muted);width:70px;flex-shrink:0;">${fmtH(a.startHour)}</div>

        <div style="font-size:13px;font-weight:500;color:var(--text-primary);">${a.customer}</div>
        <div style="font-size:11px;color:var(--text-muted);">${a.service}${staff?' &middot; '+staff.name:''}</div>
      </div>
      <span class="tag" style="background:${sc.bg};color:${sc.col};text-transform:capitalize;">${a.status}</span>
    </div>`;
  });
  html+=`</div>

    <!-- This Week -->
    <div class="card" style="padding:1.25rem;margin-bottom:1rem;">
      <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;">This Week</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;">`;

// ── SCHEDULE ───────────────────────────────────────────────────────────────
function getStaffOrder(biz){return state.staffOrder[biz]||BIZ[biz].staff.map(s=>s.id);}
function getOrderedStaff(biz){return getStaffOrder(biz).map(id=>BIZ[biz].staff.find(s=>s.id===id)).filter(Boolean);}
function buildSkillColorMap(biz){const allSkills=[...new Set(BIZ[biz].staff.flatMap(s=>s.skills||[]))];const map={};allSkills.forEach((sk,i)=>{map[sk]=SKILL_COLORS[i%SKILL_COLORS.length];});return map;}

// ── SCHEDULE — Calendar / Staff / Resources / List sub-tabs ───────────────
// Mirrors the live SchedulerView.tsx: four view tabs over the same booking
// data. Staff = the staff×hours grid (NewSchedulerView); Resources = the
// same grid keyed by resource (ResourceColumnsView); Calendar = month view
// (AppointmentView/BigCalendar); List = AppointmentListView. Tab labels use
// the business vocabulary (Technicians/Service Trucks, Stylists/Chairs, …).
function staffToResourceMap(b){
  // Each staff member maps to one active resource (tech→truck, stylist→chair)
  // so the Resources grid shows the same appointments grouped by place.
  const res=b.resources.filter(r=>r.status==='Active');
  const m={};
  b.staff.forEach((s,i)=>{ m[s.id]=res.length?res[i%res.length].id:null; });
  return m;
}

function renderSchedule(){
  const b=BIZ[state.biz];
  const tab=state.schedTab||'staff';
  const isGrid=tab==='staff'||tab==='resources';

  const saveBar=(tab==='staff'&&state.staffOrderDirty)?`
  <div style="display:flex;align-items:center;gap:8px;background:var(--accent-muted);border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:12px;color:var(--accent-soft);">
    <span>Staff order changed</span>
    <button onclick="saveStaffOrder()" style="background:var(--accent);color:#fff;border:none;padding:3px 12px;border-radius:5px;font-size:12px;cursor:pointer;font-family:var(--font-body);">Save</button>
    <button onclick="discardStaffOrder()" style="background:transparent;color:var(--text-secondary);border:1px solid var(--border-soft);padding:3px 10px;border-radius:5px;font-size:12px;cursor:pointer;font-family:var(--font-body);">Discard</button>
  </div>`:'';

  // Hours/Skills toggle is staff-only (skills don't apply to resources);
  // zoom applies to either grid. Book Appointment is always available.
  const skillsToggle=tab==='staff'?`
      <div style="display:flex;background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:7px;overflow:hidden;">
        <button onclick="setSkillsMode(false)" style="padding:5px 14px;font-size:12px;font-weight:500;border:none;cursor:pointer;font-family:var(--font-body);background:${!state.skillsMode?'var(--accent)':'transparent'};color:${!state.skillsMode?'#fff':'var(--text-secondary)'};">Hours</button>
        <button onclick="setSkillsMode(true)" style="padding:5px 14px;font-size:12px;font-weight:500;border:none;cursor:pointer;font-family:var(--font-body);background:${state.skillsMode?'var(--accent)':'transparent'};color:${state.skillsMode?'#fff':'var(--text-secondary)'};">Skills</button>
      </div>`:'';
  const zoomCtl=isGrid?`
      <div style="display:flex;align-items:center;gap:6px;background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:7px;padding:4px 8px;">
        <span style="font-size:11px;color:var(--text-muted);">Zoom</span>
        <button onclick="setZoom(-16)" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;">&#8722;</button>
        <span style="font-size:11px;color:var(--accent-soft);min-width:32px;text-align:center;">${Math.round((state.zoom/72)*100)}%</span>
        <button onclick="setZoom(16)" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;">+</button>
      </div>`:'';

  const tb=(id,label)=>`<button class="tab-btn${tab===id?' active':''}" onclick="state.schedTab='${id}';showView('schedule')">${label}</button>`;

  let html=`<div class="page-wrap" style="display:flex;flex-direction:column;height:100%;gap:0.85rem;">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-wrap:wrap;gap:8px;">
    <div><div class="page-title">Schedule</div><div class="page-sub">Today &middot; ${b.name}</div></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      ${saveBar}${skillsToggle}${zoomCtl}
      <button class="btn-primary" onclick="openModal()">+ Book Appointment</button>
    </div>
  </div>

  <div style="display:flex;gap:0;border-bottom:1px solid var(--border-soft);flex-shrink:0;">
    ${tb('calendar','Calendar')}${tb('staff',b.staffLabel)}${tb('resources',b.resourceLabel)}${tb('list','List')}
  </div>`;

  if(tab==='calendar')      html+=renderSchedCalendar(b);
  else if(tab==='list')     html+=renderSchedList(b);
  else                      html+=renderSchedGrid(b,tab); // staff | resources
  html+=`</div>`;
  return html;
}

// Two-column staff×hours / resource×hours grid. `mode` is 'staff' or
// 'resources'. Reuses the lane-slot / appt / sched-* ids so
// bindScheduleEvents wires clicks + scroll sync for either grid.
function renderSchedGrid(b,mode){
  const COL_W=state.zoom;
  const isStaff=mode==='staff';
  const rows=isStaff?getOrderedStaff(state.biz):b.resources.filter(r=>r.status==='Active');
  const skillColorMap=isStaff?buildSkillColorMap(state.biz):{};
  const resMap=isStaff?null:staffToResourceMap(b);
  const rowHeights=rows.map(r=>(isStaff&&state.skillsMode)?Math.max(54,(r.skills||[]).length*22+16):54);

  let html=`<div style="background:var(--bg-card);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;flex:1;display:grid;grid-template-columns:160px 1fr;min-height:0;">
    <div style="display:flex;flex-direction:column;border-right:1px solid var(--border-soft);background:var(--bg-raised);z-index:5;overflow:hidden;">
      <div style="height:38px;flex-shrink:0;padding:0 14px;display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border-soft);">${isStaff?b.staffLabel:b.resourceLabel}</div>
      <div style="overflow-y:auto;flex:1;" id="staff-col">`;
  rows.forEach((r,idx)=>{
    const rh=rowHeights[idx];
    if(isStaff){
      html+=`<div style="height:${rh}px;padding:0 8px 0 4px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border-soft);flex-shrink:0;background:var(--bg-raised);"
        draggable="true" data-staffid="${r.id}" id="namerow-${r.id}"
        ondragstart="onDragStart(event,'${r.id}')" ondragover="onDragOver(event,'${r.id}')" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${r.id}')">
        <div style="cursor:grab;color:var(--text-muted);flex-shrink:0;padding:4px 2px;" title="Drag to reorder">
          <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="2" r="1.2"/><circle cx="7" cy="2" r="1.2"/><circle cx="3" cy="6" r="1.2"/><circle cx="7" cy="6" r="1.2"/><circle cx="3" cy="10" r="1.2"/><circle cx="7" cy="10" r="1.2"/></svg>
        </div>
        <div style="display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:pointer;" onclick="showStaffCard('${r.id}',event)" title="View profile">
          <div class="avatar" style="width:26px;height:26px;font-size:11px;background:${r.color};flex-shrink:0;">${r.initials}</div>
          <div style="min-width:0;">
            <div style="font-size:12px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.name}</div>
            <div style="font-size:11px;color:var(--text-muted);">${r.role}</div>
          </div>
        </div>
      </div>`;
    } else {
      html+=`<div style="height:${rh}px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-soft);flex-shrink:0;background:var(--bg-raised);">
        <div class="avatar" style="width:26px;height:26px;font-size:11px;background:var(--accent-muted);color:var(--accent-soft);flex-shrink:0;">${r.name.charAt(0)}</div>
        <div style="min-width:0;">
          <div style="font-size:12px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.name}</div>
          <div style="font-size:11px;color:var(--green);">${r.status}</div>
        </div>
      </div>`;
    }
  });
  html+=`</div></div>
    <div style="display:flex;flex-direction:column;overflow:hidden;">
      <div style="overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border-soft);" id="sched-header">
        <div style="display:flex;height:38px;width:${HOURS.length*COL_W}px;">`;

    html+=`<div style="width:${COL_W}px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:${inHours?'var(--text-secondary)':'var(--text-muted)'};border-left:1px solid var(--border-soft);font-weight:${inHours?500:400};background:${inHours?'transparent':'rgba(0,0,0,0.28)'};">${fmtH(h)}</div>`;
  });
  html+=`</div></div>
      <div style="overflow:auto;flex:1;" id="sched-body">
        <div style="width:${HOURS.length*COL_W}px;">`;
  rows.forEach((r,idx)=>{
    const rh=rowHeights[idx];
    const rAppts=isStaff?state.appts.filter(a=>a.staffId===r.id):state.appts.filter(a=>resMap[a.staffId]===r.id);
    const slotStaff=isStaff?r.id:(b.staff[0]?b.staff[0].id:'');
    html+=`<div style="height:${rh}px;border-bottom:1px solid var(--border-soft);position:relative;display:flex;" id="apptrow-${r.id}">`;

      const inHours=h>=b.openHour&&h<b.closeHour;
      html+=`<div class="lane-slot" data-staff="${slotStaff}" data-hour="${h}" style="width:${COL_W}px;flex-shrink:0;height:${rh}px;border-left:1px solid var(--border-soft);background:${inHours?'transparent':'rgba(0,0,0,0.28)'};" title="Book ${r.name} at ${fmtH(h)}"></div>`;

    } else {

        const sc=a.status==='confirmed'?{bg:'rgba(37,99,235,0.28)',bd:'rgba(37,99,235,0.55)',tx:'#BAD4FF'}:a.status==='pending'?{bg:'rgba(252,211,77,0.18)',bd:'rgba(252,211,77,0.45)',tx:'#FDE68A'}:{bg:'rgba(52,211,153,0.15)',bd:'rgba(52,211,153,0.35)',tx:'#6EF0C4'};
        const left=a.startHour*COL_W+2,width=a.duration*COL_W-4;
        html+=`<div class="appt" data-id="${a.id}" style="position:absolute;left:${left}px;top:5px;bottom:5px;width:${width}px;background:${sc.bg};border:1px solid ${sc.bd};border-radius:6px;padding:4px 8px;cursor:pointer;overflow:hidden;z-index:2;">

        </div>`;
      });

    html+=`</div>`;
  });
  html+=`</div></div></div>`;

  // Legend
  if(isStaff&&state.skillsMode){
    const allSkills=[...new Set(BIZ[state.biz].staff.flatMap(s=>s.skills||[]))];
    html+=`<div style="display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap;">
      <span style="font-size:11px;color:var(--text-muted);font-weight:600;">SKILLS:</span>`;
    allSkills.forEach(sk=>{html+=`<div style="display:flex;align-items:center;gap:4px;"><div style="width:10px;height:10px;border-radius:2px;background:${skillColorMap[sk]};opacity:0.7;"></div><span style="font-size:11px;color:var(--text-muted);">${sk}</span></div>`;});
    html+=`</div>`;
  } else {
    html+=`<div style="display:flex;gap:14px;align-items:center;flex-shrink:0;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(37,99,235,0.28);border:1px solid rgba(37,99,235,0.55);"></div><span style="font-size:11px;color:var(--text-muted);">Confirmed</span></div>
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(252,211,77,0.18);border:1px solid rgba(252,211,77,0.45);"></div><span style="font-size:11px;color:var(--text-muted);">Pending</span></div>
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:10px;height:10px;border-radius:3px;background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.35);"></div><span style="font-size:11px;color:var(--text-muted);">Completed</span></div>
      <span style="font-size:11px;color:var(--text-muted);margin-left:auto;">${isStaff?'Drag to reorder &middot; ':''}Click slot to book &middot; Click appointment for details</span>
    </div>`;
  }
  return html;
}

// Month calendar (AppointmentView / BigCalendar equivalent). Current month,
// today highlighted, appointment counts on representative days.
function renderSchedCalendar(b){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),today=now.getDate();
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const monthName=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  // Deterministic sample counts so weekdays read as "booked"; today shows the
  // live appointment count from the demo's working set.
  const sample=[0,3,4,2,5,3,1,0];
  let html=`<div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden;padding:1rem 1.25rem 1.25rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div style="font-family:var(--font-display);font-size:1.15rem;letter-spacing:0.03em;color:var(--text-primary);">${monthName}</div>
      <div style="display:flex;gap:6px;">
        <button style="${WD_NAV_STYLE}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button style="${WD_NAV_STYLE}padding:6px 12px;font-size:12px;font-weight:700;">Today</button>
        <button style="${WD_NAV_STYLE}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);border-radius:8px;overflow:hidden;flex:1;min-height:0;">`;
  wd.forEach(d=>{html+=`<div style="background:var(--bg-raised);padding:7px;text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">${d}</div>`;});
  const cells=Math.ceil((first+dim)/7)*7;
  for(let i=0;i<cells;i++){
    const day=i-first+1,valid=day>=1&&day<=dim;
    if(!valid){html+=`<div style="background:var(--bg-card);opacity:0.4;"></div>`;continue;}
    const dow=new Date(y,m,day).getDay(),isToday=day===today;
    const cnt=isToday?state.appts.length:(dow===0||dow===6?0:sample[dow]);
    html+=`<div style="background:var(--bg-card);padding:6px 7px;min-height:62px;display:flex;flex-direction:column;${isToday?'box-shadow:inset 0 0 0 2px var(--accent);':''}">
      <div style="font-size:12px;font-weight:${isToday?700:500};color:${isToday?'var(--accent-soft)':'var(--text-secondary)'};margin-bottom:4px;">${day}</div>
      ${cnt>0?`<div style="margin-top:auto;font-size:11px;font-weight:600;color:var(--accent-soft);background:var(--accent-muted);border-radius:5px;padding:2px 6px;align-self:flex-start;">${cnt} appt${cnt>1?'s':''}</div>`:''}
    </div>`;
  }
  html+=`</div></div>`;
  return html;
}

// Flat appointment list (AppointmentListView equivalent). Rows reuse the
// .appt class + data-id so a click opens the same detail panel as the grid.
function renderSchedList(b){
  const appts=[...state.appts].sort((x,y)=>x.startHour-y.startHour);
  let html=`<div class="card" style="flex:1;overflow-y:auto;padding:0;">
    <div style="display:grid;grid-template-columns:90px 1.4fr 1.4fr 1fr 110px;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border-soft);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);position:sticky;top:0;background:var(--bg-card);z-index:2;">
      <div>Time</div><div>Customer</div><div>Service</div><div>${b.staffLabel.replace(/s$/,'')}</div><div>Status</div>
    </div>`;
  if(!appts.length){
    html+=`<div style="padding:32px;text-align:center;font-size:13px;color:var(--text-muted);">No appointments booked.</div>`;
  }
  appts.forEach(a=>{
    const staff=b.staff.find(s=>s.id===a.staffId);
    const sc=a.status==='confirmed'?{bg:'var(--accent-muted)',col:'var(--accent-soft)'}:a.status==='completed'?{bg:'rgba(52,211,153,0.1)',col:'var(--green)'}:{bg:'rgba(252,211,77,0.1)',col:'var(--yellow)'};
    html+=`<div class="sched-list-row" data-id="${a.id}" style="display:grid;grid-template-columns:90px 1.4fr 1.4fr 1fr 110px;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;font-size:13px;">
      <div style="color:var(--text-muted);font-size:12px;">${fmtH(a.startHour)}</div>
      <div style="color:var(--text-primary);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.customer}</div>
      <div style="color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.service}</div>
      <div style="color:var(--text-secondary);display:flex;align-items:center;gap:6px;min-width:0;">${staff?`<div class="avatar" style="width:20px;height:20px;font-size:8px;background:${staff.color};flex-shrink:0;">${staff.initials}</div><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${staff.name}</span>`:'—'}</div>
      <div><span class="tag" style="background:${sc.bg};color:${sc.col};text-transform:capitalize;">${a.status}</span></div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}

function bindScheduleEvents(){
  document.querySelectorAll('.lane-slot').forEach(el=>{
    el.addEventListener('click',()=>openModal(el.dataset.staff,parseFloat(el.dataset.hour)));
  });
  document.querySelectorAll('.appt').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();showDetail(el.dataset.id);});
  });
  document.querySelectorAll('.sched-list-row').forEach(el=>{
    el.addEventListener('click',()=>showDetail(el.dataset.id));
  });
  const body=document.getElementById('sched-body'),header=document.getElementById('sched-header'),staffCol=document.getElementById('staff-col');
  const earliest=state.appts.length?Math.min(...state.appts.map(a=>a.startHour)):7;
  const scrollX=Math.max(0,earliest-1)*state.zoom;
  if(body)body.scrollLeft=scrollX;
  if(header)header.scrollLeft=scrollX;
  if(body&&header){body.addEventListener('scroll',()=>{header.scrollLeft=body.scrollLeft;if(staffCol)staffCol.scrollTop=body.scrollTop;},{passive:true});}
}

function showDetail(id){
  const a=state.appts.find(x=>x.id===id);if(!a)return;
  state.selAppt=id;
  const b=BIZ[state.biz];
  document.getElementById('dp-name').textContent=a.customer;
  const rows=[['Service',a.service],['Time',`${fmtH(a.startHour)} - ${fmtH(a.startHour+a.duration)}`],['Staff',b.staff.find(s=>s.id===a.staffId)?.name],['Phone',a.phone],['Status',a.status]];
  document.getElementById('dp-rows').innerHTML=rows.map(([l,v])=>`<div class="detail-row"><span style="color:var(--text-muted);">${l}</span><span style="color:${l==='Status'?(a.status==='confirmed'?'var(--accent-soft)':a.status==='completed'?'var(--green)':'var(--yellow)'):'var(--text-primary)'};font-weight:${l==='Status'?600:400};text-transform:${l==='Status'?'capitalize':'none'};">${v}</span></div>`).join('')+(a.notes?`<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;font-style:italic;">${a.notes}</div>`:'');
  document.getElementById('dp-del').onclick=()=>{state.appts=state.appts.filter(x=>x.id!==id);updateSidebar();showView('schedule');closeDetail();};

}

    const returnData=[{svc:b.services[0].name,ret:78,col:'#2563EB'},{svc:b.services[1].name,ret:65,col:'#7C3AED'},{svc:b.services[2].name,ret:52,col:'#0891B2'}];
    returnData.forEach(r=>{
      html+=`<div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span style="font-size:12px;color:var(--text-primary);">${r.svc}</span><span style="font-size:12px;color:var(--text-secondary);">${r.ret}%</span></div>
        <div style="height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${r.ret}%;background:${r.col};border-radius:3px;opacity:0.7;"></div></div>
      </div>`;
    });
    html+=`</div></div>

    <div class="card" style="padding:1.25rem;">
      <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;">No-Show Pattern</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:1rem;">Which days have the most no-shows?</div>
      <div style="display:flex;gap:8px;align-items:flex-end;">`;
    weekDays.forEach((d,i)=>{
      const col=noShows[i]>=3?'var(--red)':noShows[i]>=2?'var(--yellow)':'var(--green)';
      const pct=Math.round((noShows[i]/Math.max(...noShows))*100);
      html+=`<div style="flex:1;text-align:center;">
        <div style="font-size:13px;font-weight:600;color:${col};margin-bottom:4px;">${noShows[i]}</div>
        <div style="height:40px;background:rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;display:flex;align-items:flex-end;"><div style="width:100%;background:${col};opacity:0.6;border-radius:4px;height:${pct}%;"></div></div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${d}</div>
      </div>`;
    });
    html+=`</div></div>
    <div style="margin-top:8px;font-size:11px;color:var(--text-muted);text-align:right;">Demo data &mdash; your real numbers will appear here</div>
    </div>`;
  } else if(tab==='knowledge'){
    html+=`<div style="max-width:700px;">
      <div class="card" style="padding:1.25rem;margin-bottom:1rem;">
        <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;">Policy Q&A</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:1rem;">Answer common questions so your AI can respond accurately to callers.</div>`;
    const questions=[
      {cat:'Hours & Location',q:'What are your business hours?',a:'We are open Monday through Friday, 7 AM to 6 PM.'},
      {cat:'Hours & Location',q:'Where are you located?',a:'We are a mobile service and come to your location.'},
      {cat:'Pricing',q:'How much does a tire rotation cost?',a:'Tire rotation is $60. We come to you at no extra charge.'},
      {cat:'Cancellation',q:'What is your cancellation policy?',a:'We ask for 2 hours notice for cancellations. No fee for cancellations with notice.'},
    ];
    questions.forEach(q=>{
      html+=`<div style="background:var(--bg-raised);border:1px solid var(--border-soft);border-radius:8px;padding:12px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
          <span class="tag" style="background:var(--accent-muted);color:var(--accent-soft);font-size:11px;">${q.cat}</span>
        </div>
        <div style="font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:4px;">${q.q}</div>
        <div style="font-size:12px;color:var(--text-secondary);line-height:1.5;">${q.a}</div>
      </div>`;
    });
    html+=`</div>

      <div class="card" style="padding:1.25rem;">
        <div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;">Documents</div>
        <div style="background:var(--bg-raised);border:2px dashed var(--border-soft);border-radius:8px;padding:2rem;text-align:center;">
          <div style="font-size:13px;color:var(--text-muted);">Upload documents for your AI to reference</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">PDF, TXT, DOCX accepted</div>
        </div>
      </div>
    </div>`;
  }

  html+=`</div>`;
  return html;
}

// ── MODAL ──────────────────────────────────────────────────────────────────
function openModal(staffId,startHour){
  const b=BIZ[state.biz];
  document.getElementById('m-staff-lbl').textContent=b.staffLabel.slice(0,-1);
  const ms=document.getElementById('m-staff');
  ms.innerHTML=b.staff.map(s=>`<option value="${s.id}">${s.name} - ${s.role}</option>`).join('');
  if(staffId)ms.value=staffId;
  document.getElementById('m-svc').innerHTML=b.services.map(s=>`<option value="${s.id}">${s.name} - ${s.duration}hr / $${s.price}</option>`).join('');
  const mh=document.getElementById('m-hour');
  mh.innerHTML=Array.from({length:18},(_,i)=>8+i*.5).map(h=>`<option value="${h}">${fmtH(h)}</option>`).join('');
  if(startHour)mh.value=startHour;
  document.getElementById('m-name').value='';
  document.getElementById('m-phone').value='';
  document.getElementById('m-notes').value='';
  document.getElementById('m-preview').style.display='none';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

function updatePreview(){
  const name=document.getElementById('m-name').value.trim();
  if(!name){document.getElementById('m-preview').style.display='none';return;}
  const b=BIZ[state.biz];
  const staff=b.staff.find(s=>s.id===document.getElementById('m-staff').value);
  const svc=b.services.find(s=>s.id===document.getElementById('m-svc').value);
  const h=parseFloat(document.getElementById('m-hour').value);
  const p=document.getElementById('m-preview');
  p.style.display='block';
  p.innerHTML=`Booking <b>${name}</b> with <b>${staff.name}</b> for <b>${svc.name}</b> at <b>${fmtH(h)}</b> - ends ${fmtH(h+svc.duration)} / $${svc.price}`;
}

function confirmBooking(){
  const name=document.getElementById('m-name').value.trim();if(!name)return;
  const b=BIZ[state.biz];
  const svc=b.services.find(s=>s.id===document.getElementById('m-svc').value);
  state.appts.push({id:'new-'+Date.now(),staffId:document.getElementById('m-staff').value,customer:name,service:svc.name,startHour:parseFloat(document.getElementById('m-hour').value),duration:svc.duration,status:'confirmed',phone:document.getElementById('m-phone').value||'Not provided',notes:document.getElementById('m-notes').value});
  updateSidebar();closeModal();showView('schedule');
}

// ── SKILLS TOGGLE ────────────────────────────────────────────────────────
function setSkillsMode(on){state.skillsMode=on;showView('schedule');}

// ── DRAG TO REORDER ──────────────────────────────────────────────────────
function onDragStart(e,staffId){
  state.dragSrc=staffId;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',staffId);
  setTimeout(()=>{const el=document.getElementById('namerow-'+staffId);if(el)el.style.opacity='0.4';const ar=document.getElementById('apptrow-'+staffId);if(ar)ar.style.opacity='0.4';},0);
}
function onDragOver(e,staffId){
  e.preventDefault();e.dataTransfer.dropEffect='move';if(staffId===state.dragSrc)return;
  const el=document.getElementById('namerow-'+staffId);if(el)el.style.borderTop='2px solid var(--accent)';
  const ar=document.getElementById('apptrow-'+staffId);if(ar)ar.style.borderTop='2px solid var(--accent)';
}
function onDragLeave(e){document.querySelectorAll('[id^="namerow-"],[id^="apptrow-"]').forEach(el=>{el.style.borderTop='';});}
function onDrop(e,targetId){
  e.preventDefault();onDragLeave(e);const srcId=state.dragSrc;if(!srcId||srcId===targetId)return;
  const srcEl=document.getElementById('namerow-'+srcId);if(srcEl)srcEl.style.opacity='';
  const srcAr=document.getElementById('apptrow-'+srcId);if(srcAr)srcAr.style.opacity='';
  const order=[...getStaffOrder(state.biz)];const fromIdx=order.indexOf(srcId);const toIdx=order.indexOf(targetId);
  if(fromIdx===-1||toIdx===-1)return;order.splice(fromIdx,1);order.splice(toIdx,0,srcId);
  state.staffOrder[state.biz]=order;state.staffOrderDirty=true;state.dragSrc=null;showView('schedule');
}
function saveStaffOrder(){state.savedStaffOrder[state.biz]=[...getStaffOrder(state.biz)];state.staffOrderDirty=false;showView('schedule');}
function discardStaffOrder(){state.staffOrder[state.biz]=state.savedStaffOrder[state.biz]?[...state.savedStaffOrder[state.biz]]:null;state.staffOrderDirty=false;showView('schedule');}

// ── ZOOM ──────────────────────────────────────────────────────────────────
function setZoom(delta){state.zoom=Math.min(140,Math.max(36,state.zoom+delta));showView('schedule');}

// ── STAFF CARD ────────────────────────────────────────────────────────────
function showStaffCard(staffId,e){
  e.stopPropagation();const b=BIZ[state.biz];const s=b.staff.find(x=>x.id===staffId);if(!s)return;
  const todayAppts=state.appts.filter(a=>a.staffId===s.id);const todayHrs=todayAppts.reduce((sum,a)=>sum+a.duration,0);
  document.getElementById('sc-avatar').style.background=s.color;document.getElementById('sc-avatar').textContent=s.initials;
  document.getElementById('sc-name').textContent=s.name;document.getElementById('sc-role').textContent=s.role;
  document.getElementById('sc-today').textContent=`${todayAppts.length} appts / ${todayHrs}hrs`;
  document.getElementById('sc-shift').textContent=s.shift||'Not set';
  document.getElementById('sc-skills').innerHTML=(s.skills||[]).map(sk=>`<div style="font-size:12px;color:var(--text-secondary);padding:2px 0 2px 12px;">${sk}</div>`).join('');
  const card=document.getElementById('staff-card');card.style.display='block';
  const rect=e.currentTarget.getBoundingClientRect();
  let top=rect.bottom+4,left=rect.left;
  if(left+220>window.innerWidth)left=window.innerWidth-228;
  if(top+280>window.innerHeight)top=rect.top-284;
  card.style.top=top+'px';card.style.left=left+'px';
}
function closeStaffCard(){document.getElementById('staff-card').style.display='none';}

// ── INIT ───────────────────────────────────────────────────────────────────
document.getElementById('biz-name-top').textContent=BIZ.tire.name;
document.addEventListener('click',()=>closeStaffCard());
updateSidebar();
showView('home');
</script>
</body>
</html>
